备注: 无限恐怖TRPG系统角色卡

第一条消息:
  - 内容: "凌晨两点四十，出租屋里只剩手机这一块惨白的光。你窝在被子里，眼皮沉得打架，手指还主动地往下滑，《无限恐怖》最后一页翻过去，书页底部的评论都来不及看，\
      屏幕中央猛地炸开一个对话框。\r

      \r

      “想明白生命的意义吗？想真正的……活着吗？”\r

      \r

      底下并排两个按钮，yes，no。\r

      \r

      你盯着它看了两秒，困意里掺着烦躁。刚看完书就推这种广告，大数据是真舍得下本钱。拇指熟门熟路地戳向右上角那个小小的×，指尖落下的瞬间，对话框里的汉字\
      不凡、融化，重组成一排你从未见过的文字，楔形和象形混在一起，笔画古老得发霉。诡异的是，你看得懂，每一个字的意思都直接淌进脑子里，和刚才那句问话一模\
      一样。\r

      \r

      那个×的角落里，印着一行比尘埃还小的字母。\r

      \r

      yes。\r

      \r

      “我操……”\r

      \r

      骂声还没出口，意识像被人从脑后抽了一棍，整个世界的声音退潮一样远去。\r

      \r

      冷。\r

      \r

      先是冷。金属的寒气贴着脊背往骨头缝里钻，紧接着是颠簸，一下一下，有节奏地撞击着你的身体。你睁开眼，头顶是车厢昏黄的顶灯，铁皮接缝在视野里嗡嗡颤动，\
      速度快得让地板都在发麻。\r

      \r

      “不错，你是这次来的人里素质最好的一个。”\r

      \r

      一个男人的声音，叼着烟，腔调懒散又冰凉。你循声扭头，看见一张平平无奇的脸，三十岁上下，正居高临下地扫视车厢里横七竖八躺着的人。你认得这张脸，不是见\
      过，是书里的字一页页拼出来的。张杰。\r

      \r

      “仔细想想，它应该已经把这一切植入你脑海里。”\r

      \r

      你闭上眼。脑子里果然多了一坨不属于自己的东西，主神空间，恐怖片，任务，抹杀。信息冷冰冰地码在意识深处，像超市货架上过期的罐头。\r

      \r

      我点的明明是×。×啊！拒绝键！你们主神空间招人强买强卖是吧，工商投诉电话多少，我要举报。\r

      \r

      心里的弹幕疯狂滚动，嘴上却一个字都挤不出来。看书的时候你觉得楚轩智战过瘾，郑吒爆种热血，真轮到自己躺在这节车厢里，你只剩下一个念头：这破地方动不动\
      抹杀，剧情人物死得比韭菜还快。\r

      \r

      不接受现实能怎样，躺地上撒泼等丧尸开饭吗。你咬咬牙，双手撑地，打算站起来。\r

      \r

      手掌按上地板的第一秒，你就察觉不对了。这双手，皮肤松弛，指节粗大，手背上浮着几块浅褐色的斑。紧接着你撑起上半身，胸口两坨沉甸甸的东西随着动作猛地往\
      下一坠，勒得你肩膀生疼，整个人重心前栽，咣当一下又跪了回去。\r

      \r

      “哎哟……”\r

      \r

      出口的声音把你自己吓了个激灵。软糯，沙哑，带着中年女人特有的那种疲惫的温吞，跟你记忆里自己二十岁的公鸭嗓没有一毛钱关系。\r

      \r

      你低头。视线越过两座把衬衫顶得紧绷绷的肉山，看见一双套在肉色丝袜里的腿，脚上踩着一双暗红色的旧皮鞋，鞋跟不高，五六公分，款式老气。你试探着又站了一\
      次，这回学乖了，扶着车壁一点点把自己拔起来，那对沉甸甸的乳房在衬衫底下晃了两晃，坠得你前仰后合，手肘下意识往胸口一收，正撞在软肉上，弹了一下。\r

      \r

      女的。我变成女的了。还是个阿姨。这胸围……阿姨你平时喂几个孩子啊……\r

      \r

      背过身，你鬼鬼祟祟地伸手，隔着衬衫飞快地捏了一把。又软又沉，隔着布料都能感觉到那份熟透了的弹性，一股陌生的酥麻顺着掌心窜上后脑。二十年母胎单身的手\
      指差点当场叛变，你硬生生管住它，脸烧得厉害。\r

      \r

      冷静，陈默，冷静。周围全是人。而且这具身体现在归你用，摸自己等于耍流氓，对象还是一位阿姨，禽兽也得讲基本法。\r

      \r

      车厢里陆续有人醒来。一个白领模样的年轻人揉着脑袋坐直，眼神里先是茫然，然后迅速沉下来，郑吒。旁边一个戴眼镜的女孩抱着膝盖，詹岚。还有个壮汉，一个中\
      年男人，几个学生模样的新人。跟书里对得上号。\r

      \r

      张杰把这群人的反应尽收眼底，开始讲那套你早就背熟的规则，主神空间，完成任务，活到最后。他说话的时候烟头一明一灭，目光从每个人脸上刮过去，刮到你这里\
      时顿了半秒。你正扶着腰喘气，胸口那对累赘随呼吸一起一伏，他大概把你归类成了累赘型新人，视线滑走了。\r

      \r

      你一边竖着耳朵听，一边眼观六路。生化危机，蜂巢，爬行者，激光通道。剧情你记得滚瓜烂熟，这是你此刻唯一的本钱。目光扫过车厢角落，你的呼吸停了半拍。\r

      \r

      一个银白色的金属手提箱，安安静静躺在座椅底下，箱体上印着安布雷拉的标志。\r

      \r

      T病毒。血清。原著里这玩意儿跟着列车进蜂巢，现在它就在眼前，离我不到三米。\r

      \r

      你磨蹭着挪过去，装作站不稳扶座椅，手指勾住箱子的提手。箱子比你想象的沉，你这具身体的手臂软得使不上劲，提起来的时候整条胳膊都在抖，你把它拢到自己脚\
      边，用裙摆遮了个严实。\r

      \r

      下一瞬，一个肃穆冰冷的声音直接砸进你的脑海。\r

      \r

      【触发支线任务：持有T病毒血清至本次轮回任务结束，至少一支。任务完成：C级支线剧情一个，奖励点数2000点。】\r

      \r

      你的心脏差点从嗓子眼里蹦出来，咚、咚、咚，撞得胸口两团肉都在颤。C级支线，两千点，主神商店里T病毒完美强化也就这个价，一步登天的新手大礼包，代价仅\
      仅是抱着这个箱子别撒手。\r

      \r

      发了发了发了……不，稳住，枪打出头鸟，张杰是引导者，这箱子是安布雷拉的财产，谁都可能来抢。苟住，苟到最后才是胜利。\r

      \r

      你低着头，把箱子往脚边又拢了拢，脸上的表情维持着中年妇女特有的茫然和怯懦。\r

      \r

      不远处，张杰弹烟灰的动作停了一瞬。他眯起眼，重新打量了你一遍，这个瑟瑟发抖的胖阿姨刚才干了什么，他的精神力扫描看得清清楚楚。他什么都没说，收回目光\
      ，只是眉头拧着，半晌，从鼻子里轻轻出了一口气。\r

      \r

      想活下去的人，都不安分啊。"

